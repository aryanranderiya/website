<script>
/* ============================================================================
   tpl-receipt.js (round 2) — the thermal receipt, re-composed for a 540 px
   portrait canvas (export at 3x). Body 17 px Menlo.

   Signature moves kept from the desktop original:
     1. a single thermal tape lying on a desk, slightly rotated, real shadow
     2. torn (not cut) top and bottom edges, irregular and never mirrored
     3. monospace rhythm: ASCII dash / equals rules, uppercase line items with
        dotted leaders to a right-aligned value, indented notes
     4. paper texture: thermal banding, grain, edge yellowing
     5. the tender block, THANK YOU FOR WAKING, a barcode and its number
   Added for the phone: a double-height store header (focal, 3x body), the
   deck printed double-height, and a second thermal colour (red) reserved for
   what is awaiting payment.

   Reading order: deck -> awaiting payment -> today -> overnight -> totals.
   ========================================================================== */
(() => {
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const caps = (s) => esc(String(s).toUpperCase());
  const pad2 = (n) => String(n).padStart(2, "0");

  /* A tape is torn, not cut: a fine deterministic sawtooth, different tooth
     counts and depth bands top vs bottom so the two tears never mirror. */
  const frac = (x) => x - Math.floor(x);
  function tornTeeth(n, edge) {
    const flush = edge === "top" ? 100 : 0;
    const seed = edge === "top" ? 12.9898 : 78.233;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const x = +((i / n) * 100).toFixed(2);
      if (i % 2 === 0) pts.push(`${x}% ${flush}%`);
      else {
        const j = frac(Math.sin(i * seed) * 43758.5453);
        const peak = edge === "top" ? 20 + j * 30 : 50 + j * 30;
        pts.push(`${x}% ${peak.toFixed(1)}%`);
      }
    }
    pts.push(edge === "top" ? "100% 100%" : "100% 0%");
    return `polygon(${pts.join(", ")})`;
  }
  const TEAR_TOP = tornTeeth(58, "top");
  const TEAR_BOT = tornTeeth(64, "bottom");

  /* Barcode bars derived from the edition number. */
  function barcode(seed) {
    const stops = [];
    let x = 0;
    let v = Math.imul(seed, 2654435761) >>> 0;
    for (let i = 0; i < 58; i++) {
      v = (Math.imul(v, 1103515245) + 12345) >>> 0;
      const w = 1 + (v % 3);
      if (i % 2 === 0) stops.push(`var(--ink) ${x}px ${x + w}px`);
      else stops.push(`transparent ${x}px ${x + w + 1}px`);
      x += w + (i % 2 ? 1 : 0);
    }
    return { bg: `linear-gradient(90deg, ${stops.join(", ")})`, w: x };
  }

  /* Paper grain: inline SVG fractal noise (no external asset), blended over the sheet at low opacity. */
  const grain = (id, freq) => `<svg class="grain" aria-hidden="true"><filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#${id})"/></svg>`;
  const item = (label, val, cls) =>
    `<div class="it${cls ? " " + cls : ""}" data-role="body"><span class="lb">${caps(label)}</span><span class="ld" aria-hidden="true"></span><span class="vl">${caps(val)}</span></div>`;
  const note = (t) => `<p class="nt">${caps(t)}</p>`;
  const RULE = `<div class="rule" aria-hidden="true"></div>`;
  const RULE2 = `<div class="rule dbl" aria-hidden="true"></div>`;

  EXPLORER.register({
    id: "receipt",
    name: "The Receipt",
    axes: {
      desk: [
        { id: "slate", label: "cool slate", hi: "#7d8592", a: "#6c7480", b: "#535a64" },
        { id: "baize", label: "green baize", hi: "#3b6e5b", a: "#2a5243", b: "#1c3a2f" },
        { id: "walnut", label: "walnut", hi: "#7a5a3d", a: "#5f4531", b: "#463223" },
        { id: "oxblood", label: "oxblood leather", hi: "#7d3a3a", a: "#622a2c", b: "#481d20" },
      ],
      stock: [
        { id: "thermal", label: "thermal white", paper: "#f6f4ec", edge: "rgba(92,90,82,0.07)" },
        { id: "canary", label: "canary roll", paper: "#f5ebbb", edge: "rgba(150,120,25,0.14)" },
      ],
      density: [
        { id: "crisp", label: "fresh print head", ink: "#22221f", soft: "#4f4d47", red: "#b3261e" },
        { id: "faded", label: "worn print head", ink: "#3d3b36", soft: "#5d5a53", red: "#a3302a" },
      ],
    },
    css: `
.t-receipt { box-sizing: border-box; isolation: isolate; width: 540px; padding: 56px 0 80px; display: flex; justify-content: center;
  background: radial-gradient(120% 80% at 30% 0%, var(--hi) 0%, var(--a) 45%, var(--b) 100%); font-family: Menlo, 'SF Mono', ui-monospace, monospace; }
.t-receipt * { box-sizing: border-box; margin: 0; padding: 0; }
.t-receipt .wrap { position: relative; transform: rotate(0.5deg); }
.t-receipt .wrap::before, .t-receipt .wrap::after { content: ""; position: absolute; bottom: 14px; width: 46%; height: 30px; z-index: -1; box-shadow: 0 18px 14px rgba(8,10,14,.5); }
.t-receipt .wrap::before { left: 10px; transform: rotate(-3.5deg); }
.t-receipt .wrap::after { right: 10px; transform: rotate(3.5deg); }
.t-receipt .tape { position: relative; width: 452px; padding: 44px 26px 34px; color: var(--ink); isolation: isolate;
  font-size: 17px; line-height: 1.5; letter-spacing: 0.01em; font-variant-numeric: tabular-nums;
  background:
    radial-gradient(110% 100% at 50% 50%, transparent 58%, var(--edge) 100%),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.024) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.014) 0 1px, transparent 1px 3px),
    var(--paper);
  box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 14px 26px -16px rgba(10,14,20,.55), 0 3px 8px -4px rgba(10,14,20,.4); }
.t-receipt .tape::before, .t-receipt .tape::after { content: ""; position: absolute; left: 0; right: 0; height: 10px; background: var(--paper); }
.t-receipt .tape::before { top: -9px; clip-path: ${TEAR_TOP}; }
.t-receipt .tape::after { bottom: -9px; clip-path: ${TEAR_BOT}; }
.t-receipt .grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; opacity: .14; }
.t-receipt .crease { position: absolute; left: 0; right: 0; top: 38%; height: 16px; pointer-events: none;
  background: linear-gradient(180deg, transparent 0, rgba(0,0,0,.025) 45%, rgba(0,0,0,.05) 50%, rgba(255,255,255,.4) 52%, rgba(255,255,255,.1) 62%, transparent 100%); }
.t-receipt .store { text-align: center; font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: .32em; padding-left: .32em; }
.t-receipt .meta { text-align: center; font-size: 15px; line-height: 1.6; letter-spacing: .06em; margin-top: 16px; }
.t-receipt .rule { margin: 16px 0; overflow: hidden; white-space: nowrap; letter-spacing: 0; line-height: 1; }
.t-receipt .rule::before { content: "------------------------------------------------------------"; }
.t-receipt .rule.dbl::before { content: "============================================================"; }
.t-receipt .deck { text-align: center; font-size: 22px; line-height: 1.35; font-weight: 700; letter-spacing: 0; padding: 4px 4px; }
.t-receipt .sec { letter-spacing: .14em; margin-bottom: 10px; }
.t-receipt .sec.red, .t-receipt .red .vl { color: var(--red); }
.t-receipt .it { display: flex; align-items: flex-end; margin-bottom: 4px; }
.t-receipt .lb { flex: 0 1 auto; min-width: 0; overflow-wrap: break-word; }
.t-receipt .ld { flex: 1 1 auto; min-width: 40px; height: 0; margin: 0 6px 5px; border-bottom: 2px dotted var(--soft); }
.t-receipt .vl { flex: 0 0 auto; white-space: nowrap; font-weight: 700; }
.t-receipt .nt { color: var(--soft); padding-left: 2ch; margin: 0 0 10px; }
.t-receipt .grp + .grp { margin-top: 4px; }
.t-receipt .total { font-size: 20px; font-weight: 700; }
.t-receipt .tender { text-align: center; letter-spacing: .14em; line-height: 1.7; margin-top: 12px; }
.t-receipt .thanks { text-align: center; letter-spacing: .16em; margin: 4px 0 16px; }
.t-receipt .bars { height: 64px; margin: 0 auto 8px; }
.t-receipt .barnum { text-align: center; letter-spacing: .3em; padding-left: .3em; margin-bottom: 14px; font-size: 15px; }
.t-receipt .colo { text-align: center; font-size: 13px; letter-spacing: .06em; color: var(--soft); }
`,
    render(ed, skin) {
      const c = ed.content;
      const needs = c.decisions.slice(0, 3);
      const wd3 = ed.weekday.slice(0, 3).toUpperCase();
      const parts = [];
      if (needs.length)
        parts.push(`<div class="grp"><p class="sec red">AWAITING PAYMENT &mdash; ${needs.length} ITEM${needs.length > 1 ? "S" : ""}</p>${needs.map((d) => item(d.label, d.verb, "red") + (d.note ? note(d.note) : "")).join("")}</div>`);
      if (c.today.length)
        parts.push(`<div class="grp"><p class="sec">TODAY</p>${c.today.map((e) => item(e.label, e.t24 || "EOD") + (e.note ? note(e.note) : "")).join("")}</div>`);
      if (c.overnight.length)
        parts.push(`<div class="grp"><p class="sec">OVERNIGHT &mdash; PREPAID BY GAIA</p>${c.overnight.map((e) => item(e.label, e.tag) + (e.note ? note(e.note) : "")).join("")}</div>`);
      if (c.running.length)
        parts.push(`<div class="grp"><p class="sec">STILL IN PROGRESS &mdash; GAIA</p>${c.running.map((e) => item(e.label, e.tag) + (e.note ? note(e.note) : "")).join("")}</div>`);
      const s = c.stats;
      const totals = s
        ? `${RULE}${item("Done yesterday", s.done)}${s.you && s.gaia ? note(`You ${s.you} / GAIA ${s.gaia}`) : ""}${s.mail ? item("Emails handled", s.mail) : ""}${s.focus ? item("Focus time", s.focus) : ""}${RULE2}<div class="total">${item("Total", `1 ${ed.weekday}`)}</div>`
        : "";
      const count = needs.length + c.today.length + c.overnight.length + c.running.length;
      const bc = barcode(ed.editionNo);
      return `<article class="t-receipt" style="--hi:${skin.desk.hi}; --a:${skin.desk.a}; --b:${skin.desk.b}; --paper:${skin.stock.paper}; --edge:${skin.stock.edge}; --ink:${skin.density.ink}; --soft:${skin.density.soft}; --red:${skin.density.red}">
<div class="wrap"><div class="tape">${grain("rc-g", 0.9)}<i class="crease" aria-hidden="true"></i>
  <h1 class="store">GAIA</h1>
  <p class="meta">DAILY BRIEF &mdash; REGISTER 1<br>${wd3} ${pad2(ed.day)} ${ed.monthShort.toUpperCase()} ${ed.year}&nbsp;&nbsp;${ed.time24}<br>EDITION #${ed.editionNo}<br>SERVED BY: GAIA &middot; TERMINAL 01</p>
  ${RULE}
  <p class="deck">${esc(ed.deck)}</p>
  ${RULE}
  ${EXPLORER.fold(parts).join(RULE)}
  ${totals}
  <div class="tender">${count ? `<span>ITEMS: ${count}</span><br>` : ""}<span>AUTH ${ed.editionNo}-${ed.time24.replace(":", "")} &middot; APPROVED</span></div>
  ${RULE}
  <p class="thanks">*** THANK YOU FOR WAKING ***</p>
  <div class="bars" style="width:${bc.w}px; background:${bc.bg}"></div>
  <p class="barnum">ED${ed.editionNo}-${ed.time24.replace(":", "")}-GAIA</p>
  <p class="colo">EDITION No. ${ed.editionNo} &middot; GENERATED ${ed.time24} BY GAIA</p>
</div></div></article>`;
    },
  });
})();

</script>
<script>
/* ============================================================================
   tpl-tech.js (round 2) — The Blueprint and The Instrument on a 540 px
   portrait canvas (export at 3x). Body 17 px or larger.
   Reading order: headline -> needs you -> today -> done overnight -> stats;
   empty sections are omitted.
   ========================================================================== */
(() => {
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const grain = (id, freq) =>
    `<svg class="grain" aria-hidden="true"><filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#${id})"/></svg>`;
  const hours = (t24) => {
    const [h, m] = t24.split(":").map(Number);
    return h + m / 60;
  };
  const pad2 = (n) => String(n).padStart(2, "0");
  /* Position on the 06:00-24:00 operating window, 0..1; untimed deadlines sit at 18:00. */
  const pos = (e) => ((e.t24 ? hours(e.t24) : 18) - 6) / 18;
  /* Stagger callouts that would collide into alternating levels. */
  function levels(items, minGap) {
    let last = -1;
    let lvl = 0;
    return items.map((e) => {
      const p = pos(e);
      lvl = p - last < minGap ? (lvl + 1) % 2 : 0;
      last = p;
      return lvl;
    });
  }

  /* ==========================================================================
     THE BLUEPRINT — signature moves from the desktop original:
       cyanotype ground with a drafting grid and a ruled border; "DETAIL A"
       sheet label; the day drawn as an elevation along a dimensioned
       06-24 axis with leader lines and arrowed spans; a dimension marking
       the free evening; a detail circle around the deadline; the overnight
       as a hatched section with numbered balloons; numbered NOTES; a title
       block (project, sheet, scale, drawn by, date) with the yield.
     Added detail: revision triangles on what needs you, fold creases from
     a sheet stored folded, diazo edge fade.
     ======================================================================== */
  EXPLORER.register({
    id: "flightplan",
    name: "The Blueprint",
    axes: {
      stock: [
        { id: "cyanotype", label: "cyanotype", stock: "#1b3f9a", ink: "#eef3fc", soft: "#c3d1ef", line: "rgba(238,243,252,.6)", grid: "rgba(238,243,252,.075)", warn: "#ffd28a" },
        { id: "prussian", label: "prussian blue", stock: "#0b335e", ink: "#eaf3f8", soft: "#b6cfde", line: "rgba(234,243,248,.62)", grid: "rgba(234,243,248,.075)", warn: "#ffc97e" },
        { id: "diazo", label: "diazo whiteprint", stock: "#f1efe6", ink: "#1f3487", soft: "#3d4f99", line: "rgba(31,52,135,.55)", grid: "rgba(31,52,135,.08)", warn: "#a8321c" },
      ],
      face: [
        { id: "helvetica", label: "Helvetica Neue", stack: "'Helvetica Neue', Helvetica, Arial, sans-serif" },
        { id: "condensed", label: "Avenir Condensed", stack: "'Avenir Next Condensed', 'Helvetica Neue', sans-serif" },
      ],
      folds: [
        { id: "folded", label: "folded sheet" },
        { id: "flat", label: "flat sheet" },
      ],
    },
    css: `
.t-flightplan { position: relative; isolation: isolate; box-sizing: border-box; width: 540px; padding: 18px; color: var(--ink); font: 400 17px/1.45 var(--face);
  background: radial-gradient(120% 100% at 50% 40%, transparent 60%, rgba(0,0,0,.16) 100%),
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 18px 18px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 18px 18px, var(--stock); }
.t-flightplan * { box-sizing: border-box; margin: 0; padding: 0; }
.t-flightplan .grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: soft-light; opacity: .4; z-index: -1; }
.t-flightplan .fold { position: absolute; pointer-events: none; }
.t-flightplan .fold.h { left: 0; right: 0; top: 50%; height: 3px; background: linear-gradient(180deg, rgba(0,0,0,.14), rgba(255,255,255,.12)); }
.t-flightplan .fold.v { top: 0; bottom: 0; left: 50%; width: 3px; background: linear-gradient(90deg, rgba(0,0,0,.12), rgba(255,255,255,.1)); }
.t-flightplan .sheet { position: relative; border: 1.5px solid var(--line); outline: 1px solid var(--line); outline-offset: 4px; padding: 20px 20px 18px; }
.t-flightplan .lbl { font-size: 15px; font-weight: 700; letter-spacing: 0; }
.t-flightplan .strip { display: flex; justify-content: space-between; color: var(--soft); }
.t-flightplan h1 { font-size: 27px; line-height: 1.2; font-weight: 600; margin-top: 14px; }
.t-flightplan h2 { display: flex; justify-content: space-between; padding-bottom: 6px; border-bottom: 1px solid var(--line); margin: 36px 0 12px; }
.t-flightplan .rev { display: grid; grid-template-columns: 34px 1fr; padding: 6px 0; }
.t-flightplan .tri { width: 24px; height: 22px; color: var(--warn); }
.t-flightplan .rev b { color: var(--warn); font-weight: 700; }
.t-flightplan .soft { color: var(--soft); }
.t-flightplan svg.elev { display: block; width: 100%; height: auto; overflow: visible; }
.t-flightplan svg.elev text { font-family: inherit; fill: currentColor; }
.t-flightplan .sched { display: grid; grid-template-columns: 30px 64px 1fr; padding: 6px 0; align-items: baseline; }
.t-flightplan .ball { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1.3px solid currentColor; border-radius: 50%; font-size: 13px; font-weight: 700; }
.t-flightplan .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.t-flightplan .section { display: grid; grid-template-columns: 36px 1fr; gap: 14px; }
.t-flightplan .sched > span:last-child, .t-flightplan .ov > span:last-child, .t-flightplan .rev > span { text-wrap: pretty; }
.t-flightplan .hatch { border: 1.3px solid var(--line); background: repeating-linear-gradient(45deg, var(--line) 0 1px, transparent 1px 9px); }
.t-flightplan .ov { display: grid; grid-template-columns: 30px 56px 1fr; padding: 5px 0; align-items: baseline; }
.t-flightplan .tb { margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--line); }
.t-flightplan .tb div { padding: 7px 10px; border-top: 1px solid var(--line); }
.t-flightplan .tb div:nth-child(-n+2) { border-top: 0; }
.t-flightplan .tb div:nth-child(even) { border-left: 1px solid var(--line); }
.t-flightplan .tb .wide { grid-column: 1 / -1; border-left: 0 !important; }
.t-flightplan .tb span { display: block; font-size: 14px; font-weight: 700; letter-spacing: 0; color: var(--soft); }
.t-flightplan .tb b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.t-flightplan .tb .nw { white-space: nowrap; }
`,
    render(ed, skin) {
      const c = ed.content;
      const needs = c.decisions.slice(0, 3);
      const W = 500;
      const X = (p) => 10 + p * (W - 20);
      const parts = [];
      const tri = (n) => `<svg class="tri" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 1.5 L23 20.5 H1 Z" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="12" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">${n}</text></svg>`;
      if (needs.length) parts.push(`<h2 class="lbl"><span>Revisions · needs your call</span><span>${pad2(needs.length)}</span></h2>${needs.map((d, i) => `<div class="rev" data-role="body">${tri(i + 1)}<span><b>${esc(d.verb)}</b> — ${esc(d.label)}${d.note ? ` <span class="soft">(${esc(d.note)})</span>` : ""}</span></div>`).join("")}`);
      if (c.today.length) {
        const lv = levels(c.today, 0.1);
        const ticks = [6, 9, 12, 15, 18, 21, 24].map((h) => `<line x1="${X((h - 6) / 18)}" y1="112" x2="${X((h - 6) / 18)}" y2="122" stroke="currentColor" stroke-width="1"/><text x="${X((h - 6) / 18)}" y="140" text-anchor="middle" font-size="13" font-weight="700">${pad2(h)}</text>`).join("");
        const marks = c.today.map((e, i) => {
          const x = X(pos(e));
          const y = lv[i] ? 30 : 62;
          if (!e.t24) return `<circle cx="${x}" cy="112" r="20" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><line x1="${x}" y1="92" x2="${x}" y2="${y + 11}" stroke="currentColor" stroke-width=".8"/><circle cx="${x}" cy="${y}" r="11" fill="var(--stock)" stroke="currentColor" stroke-width="1.3"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="700">${i + 1}</text>`;
          const x2 = X(Math.min(1, pos(e) + 0.5 / 18)); // a 30-minute span
          return `<line x1="${x}" y1="${y + 11}" x2="${x}" y2="112" stroke="currentColor" stroke-width=".8"/><line x1="${x}" y1="104" x2="${x2}" y2="104" stroke="currentColor" stroke-width="1"/><path d="M${x} 104 l5 -3 v6 z M${x2} 104 l-5 -3 v6 z" fill="currentColor"/><circle cx="${x}" cy="${y}" r="11" fill="var(--stock)" stroke="currentColor" stroke-width="1.3"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="700">${i + 1}</text>`;
        }).join("");
        const lastT = Math.max(...c.today.map((e) => (e.t24 ? hours(e.t24) + 0.5 : 18)), 0);
        const freeH = Math.ceil(lastT + 0.5);
        const free = lastT && freeH < 22 ? `<line x1="${X((freeH - 6) / 18)}" y1="160" x2="${X(1)}" y2="160" stroke="currentColor" stroke-width="1"/><path d="M${X((freeH - 6) / 18)} 160 l6 -3 v6 z M${X(1)} 160 l-6 -3 v6 z" fill="currentColor"/><text x="${(X((freeH - 6) / 18) + X(1)) / 2}" y="178" text-anchor="middle" font-size="13" font-weight="700">${pad2(freeH)}:00 – 24:00 · YOURS</text>` : "";
        const svg = `<svg class="elev" viewBox="0 0 ${W} 186" aria-hidden="true"><line x1="${X(0)}" y1="117" x2="${X(1)}" y2="117" stroke="currentColor" stroke-width="1.6"/>${ticks}${marks}${free}</svg>`;
        parts.push(`<h2 class="lbl"><span>Elevation · the day, 06–24</span><span>Scale 1:1</span></h2>${svg}${c.today.map((e, i) => `<div class="sched" data-role="body"><span class="ball">${i + 1}</span><span class="t">${e.t24 ? esc(e.t24) : "EOD"}</span><span>${esc(e.label)}${e.note ? ` <span class="soft">(${esc(e.note)})</span>` : ""}</span></div>`).join("")}`);
      }
      if (c.overnight.length)
        parts.push(`<h2 class="lbl"><span>Section 00–06 · while you slept</span><span>${pad2(c.overnight.length)}</span></h2><div class="section"><div class="hatch" aria-hidden="true"></div><div>${c.overnight.map((e, i) => `<div class="ov" data-role="body"><span class="ball">${String.fromCharCode(65 + i)}</span><span class="t">${esc(e.t24)}</span><span>${esc(e.label)}${e.note ? ` <span class="soft">(${esc(e.note)})</span>` : ""}</span></div>`).join("")}</div></div>`);
      if (c.running.length)
        parts.push(`<h2 class="lbl"><span>Section now · still in progress</span><span>${pad2(c.running.length)}</span></h2><div class="section"><div class="hatch" aria-hidden="true"></div><div>${c.running.map((e, i) => `<div class="ov" data-role="body"><span class="ball">${String.fromCharCode(65 + c.overnight.length + i)}</span><span class="t">${esc(e.t24)}</span><span>${esc(e.label)}${e.note ? ` <span class="soft">(${esc(e.note)})</span>` : ""}</span></div>`).join("")}</div></div>`);
      const s = c.stats;
      const tb = `<div class="tb"><div><span>Project</span><b>${esc(ed.weekday)}</b></div><div><span>Sheet</span><b>${String(ed.editionNo).padStart(3, "0")}</b></div><div><span>Drawn by</span><b>GAIA · ${esc(ed.time24)}</b></div><div><span>Date</span><b>${pad2(ed.day)} ${esc(ed.monthShort.toUpperCase())} ${ed.year}</b></div>${s ? `<div class="wide"><span>Yield</span><b><span class="nw">${s.done} done${s.you && s.gaia ? ` (${s.you} you · ${s.gaia} GAIA)` : ""}</span>${s.mail ? ` · <span class="nw">${s.mail} emails cleared</span>` : ""}${s.focus ? ` · <span class="nw">${esc(s.focus)} focus held</span>` : ""}</b></div>` : ""}</div>`;
      const folds = skin.folds.id === "folded" ? `<i class="fold h"></i><i class="fold v"></i>` : "";
      return `<article class="t-flightplan" style="--stock:${skin.stock.stock}; --ink:${skin.stock.ink}; --soft:${skin.stock.soft}; --line:${skin.stock.line}; --grid:${skin.stock.grid}; --warn:${skin.stock.warn}; --face:${skin.face.stack}">
${grain("bp-g", 0.85)}${folds}
<div class="sheet">
  <div class="strip lbl"><span>Detail A · the day — an elevation</span><span>No. ${ed.editionNo}</span></div>
  <h1>${esc(ed.deck)}</h1>
  ${EXPLORER.fold(parts).join("")}
  ${tb}
</div></article>`;
    },
  });

  /* ==========================================================================
     THE INSTRUMENT — signature moves from the desktop original:
       a dark equipment panel; GAIA wordmark with a serial strip; recessed
       modules with engraved labels; the operating-window gauge with labelled
       amber pins on a 06-24 scale; amber annunciator dots on decisions; a
       YESTERDAY readout of big numerals.
     Added detail: corner screws on every module, brushed-metal grain,
     engraved-label highlights, glowing LEDs, a NOW needle.
     ======================================================================== */
  EXPLORER.register({
    id: "instrument",
    name: "The Instrument",
    axes: {
      signal: [
        { id: "amber", label: "amber", sig: "#f5b324" },
        { id: "green", label: "avionics green", sig: "#4fd17f" },
        { id: "orange", label: "signal orange", sig: "#ff7a2a" },
        { id: "red", label: "alarm red", sig: "#ff5b4b" },
      ],
      panel: [
        { id: "graphite", label: "graphite", panel: "#1d1e21", well: "#141517", plate: "#26282c", ink: "#eceae4", soft: "#a9a8a2", hair: "#36383d" },
      ],
      face: [
        { id: "helvetica", label: "Helvetica Neue", stack: "'Helvetica Neue', Helvetica, Arial, sans-serif" },
        { id: "din", label: "Avenir Condensed", stack: "'Avenir Next Condensed', 'Helvetica Neue', sans-serif" },
      ],
    },
    css: `
.t-instrument { position: relative; isolation: isolate; box-sizing: border-box; width: 540px; padding: 28px 22px 28px; background: var(--panel); color: var(--ink); font: 400 17px/1.45 var(--face); }
.t-instrument * { box-sizing: border-box; margin: 0; padding: 0; }
.t-instrument .grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: soft-light; opacity: .45; z-index: -1; }
.t-instrument .brush { position: absolute; inset: 0; z-index: -1; background: repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px); }
.t-instrument .lbl { font-size: 15px; font-weight: 700; letter-spacing: 0; color: var(--soft); text-shadow: 0 1px 0 rgba(255,255,255,.06), 0 -1px 0 rgba(0,0,0,.6); }
.t-instrument .top { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 14px; border-bottom: 1px solid var(--hair); }
.t-instrument .brand { font: 700 34px/1 'Aeonik Extended', var(--face); letter-spacing: .01em; }
.t-instrument .serial { text-align: right; line-height: 1.6; }
.t-instrument .deck { font-size: 24px; line-height: 1.3; margin-top: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--hair); }
.t-instrument .mod { position: relative; margin-top: 22px; background: var(--plate); border-radius: 6px; padding: 16px 18px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.03); }
.t-instrument .screw { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #6d6f74, #2a2b2e 70%); box-shadow: 0 1px 0 rgba(255,255,255,.06); }
.t-instrument .screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 3.5px; height: 1px; background: rgba(0,0,0,.6); transform: rotate(var(--r)); }
.t-instrument .head { display: flex; justify-content: space-between; margin-bottom: 10px; }
.t-instrument .row { display: grid; grid-template-columns: 60px 1fr; padding: 8px 0; border-top: 1px solid var(--hair); }
.t-instrument .row:first-of-type { border-top: 0; }
.t-instrument .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.t-instrument .n { display: block; font-size: 15px; color: var(--soft); }
.t-instrument .ann { display: grid; grid-template-columns: 96px 1fr; column-gap: 14px; align-items: start; padding: 8px 0; }
.t-instrument .lamp { display: grid; place-items: center; height: 30px; border-radius: 3px; background: var(--sig); color: #16130c; font-size: 15px; font-weight: 800; letter-spacing: 0;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.2), 0 0 12px color-mix(in srgb, var(--sig) 45%, transparent); }
.t-instrument .gauge { position: relative; height: 112px; margin: 6px 0 10px; background: var(--well); border-radius: 4px; box-shadow: inset 0 2px 6px rgba(0,0,0,.6); }
.t-instrument .gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.t-instrument .gauge text { font-family: inherit; }
.t-instrument .read { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px; margin-top: 10px; }
.t-instrument .read div { background: var(--well); border-radius: 4px; padding: 10px 8px; box-shadow: inset 0 2px 5px rgba(0,0,0,.55); }
.t-instrument .read .sub { display: block; margin-top: 2px; font-size: 15px; color: var(--soft); }
.t-instrument .read b { display: block; font-size: 34px; line-height: 1; font-weight: 700; color: var(--sig); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px color-mix(in srgb, var(--sig) 40%, transparent); }
.t-instrument .read .lbl { display: block; margin-top: 6px; }
.t-instrument .foot { display: flex; justify-content: space-between; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--hair); }
`,
    render(ed, skin) {
      const c = ed.content;
      const needs = c.decisions.slice(0, 3);
      const screws = [["8px", "8px", "20deg"], ["8px", null, "70deg"], [null, "8px", "-35deg"], [null, null, "5deg"]]
        .map(([t, l, r]) => `<i class="screw" style="${t ? `top:${t}` : "bottom:8px"};${l ? `left:${l}` : "right:8px"};--r:${r}"></i>`).join("");
      const mod = (title, count, body) => `<div class="mod">${screws}<div class="head"><span class="lbl">${title}</span><span class="lbl">${count}</span></div>${body}</div>`;
      const mods = [];
      if (needs.length) mods.push(mod("Annunciator · needs your call", `${needs.length} lit`, needs.map((d) => `<div class="ann" data-role="body"><span class="lamp">${esc(d.verb)}</span><span>${esc(d.label)}${d.note ? `<span class="n">${esc(d.note)}</span>` : ""}</span></div>`).join("")));
      if (c.today.length) {
        const W = 456;
        const X = (p) => 14 + p * (W - 28);
        const lv = levels(c.today, 0.12);
        const ticks = Array.from({ length: 19 }, (_, i) => i + 6).map((h) => `<line x1="${X((h - 6) / 18)}" y1="${h % 3 ? 82 : 76}" x2="${X((h - 6) / 18)}" y2="90" stroke="var(--soft)" stroke-width="1"/>${h % 3 === 0 ? `<text x="${X((h - 6) / 18)}" y="106" text-anchor="middle" font-size="13" fill="var(--soft)">${pad2(h)}</text>` : ""}`).join("");
        const pins = c.today.map((e, i) => {
          const x = X(pos(e));
          const y = lv[i] ? 14 : 34;
          return `<line x1="${x}" y1="${y + 6}" x2="${x}" y2="84" stroke="var(--sig)" stroke-width="1"/><circle cx="${x}" cy="84" r="4" fill="var(--sig)"/><text x="${x}" y="${y}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${e.t24 ? esc(e.t24) : "EOD"}</text>`;
        }).join("");
        const now = X((hours(ed.time24) - 6) / 18);
        const gauge = `<div class="gauge"><svg viewBox="0 0 ${W} 112" preserveAspectRatio="none" aria-hidden="true">${ticks}<line x1="${now}" y1="20" x2="${now}" y2="92" stroke="var(--ink)" stroke-width="2"/><text x="${now + 5}" y="16" font-size="13" font-weight="800" fill="var(--sig)">NOW</text>${pins}</svg></div>`;
        mods.push(mod("Operating window · 06–24 local", `${c.today.length} scheduled`, gauge + c.today.map((e) => `<div class="row" data-role="body"><span class="t">${e.t24 ? esc(e.t24) : "EOD"}</span><span>${esc(e.label)}${e.note ? `<span class="n">${esc(e.note)}</span>` : ""}</span></div>`).join("")));
      }
      if (c.overnight.length) mods.push(mod("Overnight log · while you slept", `${c.overnight.length} entr${c.overnight.length === 1 ? "y" : "ies"}`, c.overnight.map((e) => `<div class="row" data-role="body"><span class="t">${esc(e.t24)}</span><span>${esc(e.label)}${e.note ? `<span class="n">${esc(e.note)}</span>` : ""}</span></div>`).join("")));
      if (c.running.length) mods.push(mod("In progress · still running", `${c.running.length} entr${c.running.length === 1 ? "y" : "ies"}`, c.running.map((e) => `<div class="row" data-role="body"><span class="t">${esc(e.t24)}</span><span>${esc(e.label)}${e.note ? `<span class="n">${esc(e.note)}</span>` : ""}</span></div>`).join("")));
      const s = c.stats;
      if (s) mods.push(mod("Yesterday · readout", "", `<div class="read"><div><b>${s.done}</b><span class="lbl">done</span>${s.you && s.gaia ? `<span class="sub">you ${s.you} · GAIA ${s.gaia}</span>` : ""}</div>${s.mail ? `<div><b>${s.mail}</b><span class="lbl">emails</span></div>` : ""}${s.focus ? `<div><b>${esc(s.focus)}</b><span class="lbl">focus today</span></div>` : ""}</div>`));
      return `<article class="t-instrument" style="--sig:${skin.signal.sig}; --panel:${skin.panel.panel}; --well:${skin.panel.well}; --plate:${skin.panel.plate}; --ink:${skin.panel.ink}; --soft:${skin.panel.soft}; --hair:${skin.panel.hair}; --face:${skin.face.stack}">
<i class="brush" aria-hidden="true"></i>${grain("in-g", 0.9)}
<div class="top"><span class="brand">GAIA</span><span class="serial lbl">GAIA RB-${ed.editionNo} · Daily briefing instrument<br>Serial ${esc(ed.weekday.slice(0, 3))} ${ed.day} ${esc(ed.monthShort)} ${ed.year} · issued ${esc(ed.time24)}</span></div>
<p class="deck">${esc(ed.deck)}</p>
${EXPLORER.fold(mods).join("")}
<div class="foot"><span class="lbl">GAIA daily brief · edition No. ${ed.editionNo}</span><span class="lbl">Issued ${esc(ed.time24)}</span></div>
</article>`;
    },
  });
})();

</script>
<script>
/* ============================================================================
   tpl-transit.js (round 2) — The Line Guide and The Boarding Pass on a 540 px
   portrait canvas (export at 3x). Body 17 px or larger.
   Reading order: headline -> needs you -> today -> done overnight -> stats;
   empty sections are omitted.
   ========================================================================== */
(() => {
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const grain = (id, freq) =>
    `<svg class="grain" aria-hidden="true"><filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#${id})"/></svg>`;
  const pad2 = (n) => String(n).padStart(2, "0");
  const title = (s) => s.charAt(0) + s.slice(1).toLowerCase();

  /* ==========================================================================
     THE LINE GUIDE — signature moves from the desktop original:
       a transit roundel with the day code; "GAIA TRANSIT AUTHORITY"; a bold
       title under a coloured rule; thick coloured lines with station ticks;
       boxed station names (white box, line-coloured outline, bold caps);
       interchange rings joining lines; a dashed line for decisions; a
       legend panel; a service-notice bar.
     Phone re-composition: the decision line, day line and GAIA's night line
     run down the page in reading order, joined by interchanges.
     Added detail: enamel-panel sheen, printed-map grain.
     ======================================================================== */
  EXPLORER.register({
    id: "metromap",
    name: "The Line Guide",
    axes: {
      livery: [
        { id: "classic", label: "red / blue / orange", day: "#cf3426", night: "#3a62c4", dec: "#e08a1e", decText: "#8a4d00" },
        { id: "tokyo", label: "green / purple / teal", day: "#237a3b", night: "#7c45b0", dec: "#2bb3c4", decText: "#095e69" },
        { id: "paris", label: "magenta / navy / gold", day: "#c4307a", night: "#2a3f8f", dec: "#d9b33a", decText: "#6e5406" },
        { id: "london", label: "brown / grey / pink", day: "#8a4a1f", night: "#4f5a66", dec: "#e98fb0", decText: "#9a2d58" },
      ],
      ground: [
        { id: "enamel", label: "cream enamel", ground: "#f3efe4", ink: "#1c1c20", soft: "#55555c", panel: "#e7e1d2" },
        { id: "white", label: "white enamel", ground: "#f7f7f5", ink: "#16171b", soft: "#53555c", panel: "#ebebe7" },
      ],
      face: [
        { id: "helvetica", label: "Helvetica Neue", stack: "'Helvetica Neue', Helvetica, Arial, sans-serif" },
        { id: "johnston", label: "Gill-style (Avenir)", stack: "'Avenir Next', 'Helvetica Neue', sans-serif" },
      ],
    },
    css: `
.t-metromap { position: relative; isolation: isolate; box-sizing: border-box; width: 540px; padding: 30px 28px 32px; color: var(--ink); font: 400 17px/1.4 var(--face);
  background: linear-gradient(160deg, rgba(255,255,255,.45), transparent 40%), var(--ground); }
.t-metromap * { box-sizing: border-box; margin: 0; padding: 0; }
.t-metromap .grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; opacity: .12; z-index: -1; }
.t-metromap .hd { display: grid; grid-template-columns: 70px 1fr; gap: 16px; align-items: center; padding-bottom: 16px; border-bottom: 4px solid var(--dec); }
.t-metromap .roundel { position: relative; width: 70px; height: 70px; border-radius: 50%; border: 12px solid var(--dec); }
.t-metromap .roundel span { position: absolute; left: -14px; right: -14px; top: 50%; transform: translateY(-50%); background: var(--night); color: #ffffff; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .1em; padding: 3px 0; }
.t-metromap .auth { font-size: 14px; font-weight: 700; letter-spacing: 0; color: var(--soft); }
.t-metromap h1 { font-size: 34px; line-height: 1.05; font-weight: 700; letter-spacing: -.015em; margin-top: 4px; }
.t-metromap .sub { font-size: 14px; color: var(--soft); margin-top: 4px; }
.t-metromap .notice { margin-top: 20px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline; background: var(--panel); padding: 14px 16px; border-radius: 3px; }
.t-metromap .notice b { font-size: 14px; letter-spacing: 0; color: var(--decText); }
.t-metromap .notice p { font-size: 20px; line-height: 1.3; font-weight: 500; }
.t-metromap .route { margin-top: 18px; }
.t-metromap .ln { position: relative; padding-left: calc(var(--x) + 40px); }
.t-metromap .ln::before { content: ""; position: absolute; left: calc(var(--x) - 5px); top: 0; bottom: 0; width: 10px; background: var(--c); }
.t-metromap .ln.dash::before { background: repeating-linear-gradient(var(--c) 0 14px, transparent 14px 22px); }
.t-metromap .chip { display: inline-block; margin: 6px 0 4px; padding: 3px 10px; border-radius: 3px; background: var(--c); color: var(--on, #ffffff); font-size: 14px; font-weight: 700; letter-spacing: 0; }
.t-metromap .st { position: relative; padding: 10px 0 12px; }
.t-metromap .st::before { content: ""; position: absolute; left: -35px; top: 18px; width: 16px; height: 7px; background: var(--c); }
.t-metromap .ln.dash .st::before { left: -52px; top: 12px; width: 16px; height: 16px; border-radius: 50%; background: var(--ground); border: 4px solid var(--c); }
.t-metromap .box { display: inline-block; border: 2.5px solid var(--c); background: #ffffff; border-radius: 4px; padding: 2px 8px; font-size: 14px; font-weight: 700; letter-spacing: 0; }
.t-metromap .box time { color: var(--soft); margin-right: 6px; font-variant-numeric: tabular-nums; }
.t-metromap .st p { margin-top: 6px; font-size: 18px; line-height: 1.32; text-wrap: pretty; }
.t-metromap .st small { display: block; font-size: 15px; color: var(--soft); margin-top: 2px; }
.t-metromap .ix { display: block; width: 100%; height: 54px; }
.t-metromap .legend { margin-top: 22px; border: 1.5px solid var(--ink); border-radius: 4px; padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 15px; }
.t-metromap .legend h3 { grid-column: 1 / -1; font-size: 15px; letter-spacing: 0; }
.t-metromap .ride { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--soft); line-height: 1.3; }
.t-metromap .ride b { display: block; font-size: 28px; line-height: 1.05; font-weight: 700; margin-bottom: 2px; }
.t-metromap .legend i { display: inline-block; width: 26px; height: 6px; vertical-align: middle; margin-right: 8px; }
.t-metromap .legend b { font-variant-numeric: tabular-nums; }
`,
    render(ed, skin) {
      const c = ed.content;
      const needs = c.decisions.slice(0, 3);
      const L = skin.livery;
      const lines = [];
      if (needs.length) lines.push({ x: 92, c: L.dec, on: "#1c1c20", cls: "dash", name: `Decision line · ${needs.length} for you`, rows: needs.map((d) => `<div class="st" data-role="body"><span class="box">${esc(d.verb)}</span><p>${esc(d.label)}${d.note ? `<small>${esc(d.note)}</small>` : ""}</p></div>`) });
      if (c.today.length) lines.push({ x: 40, c: L.day, cls: "", name: "Day line · today", rows: c.today.map((e) => `<div class="st" data-role="body"><span class="box"><time>${e.t24 ? esc(e.t24) : "EOD"}</time>${esc(title(e.tag))}</span><p>${esc(e.label)}${e.note ? `<small>${esc(e.note)}</small>` : ""}</p></div>`) });
      if (c.overnight.length) lines.push({ x: 92, c: L.night, cls: "", name: "GAIA night line · done", rows: c.overnight.map((e) => `<div class="st" data-role="body"><span class="box"><time>${esc(e.t24)}</time>${esc(title(e.tag))}</span><p>${esc(e.label)}${e.note ? `<small>${esc(e.note)}</small>` : ""}</p></div>`) });
      if (c.running.length) lines.push({ x: 92, c: L.night, cls: "", name: "GAIA night line · still running", rows: c.running.map((e) => `<div class="st" data-role="body"><span class="box"><time>${esc(e.t24)}</time>${esc(title(e.tag))}</span><p>${esc(e.label)}${e.note ? `<small>${esc(e.note)}</small>` : ""}</p></div>`) });
      const route = lines
        .map((l, i) => {
          const block = `<div class="ln ${l.cls}" style="--x:${l.x}px; --c:${l.c}${l.on ? `; --on:${l.on}` : ""}"><span class="chip">${esc(l.name)}</span>${l.rows.join("")}</div>`;
          const next = lines[i + 1];
          if (!next) return block;
          const ix = `<svg class="ix" viewBox="0 0 484 54" preserveAspectRatio="none" aria-hidden="true"><path d="M${l.x} 0 V12 L${next.x} 42 V54" fill="none" stroke="${l.c}" stroke-width="10" ${l.cls ? 'stroke-dasharray="14 8"' : ""}/><path d="M${next.x} 42 V54" stroke="${next.c}" stroke-width="10"/><circle cx="${(l.x + next.x) / 2}" cy="27" r="12" fill="#ffffff" stroke="var(--ink)" stroke-width="5"/></svg>`;
          return block + ix;
        })
        .join("");
      const s = c.stats;
      const legend = `<div class="legend"><h3>Line guide</h3>${needs.length ? `<span><i style="background:repeating-linear-gradient(90deg, ${L.dec} 0 8px, transparent 8px 12px)"></i>Decisions, your call</span>` : ""}${c.today.length ? `<span><i style="background:${L.day}"></i>Your day ahead</span>` : ""}${c.overnight.length ? `<span><i style="background:${L.night}"></i>GAIA, ran overnight</span>` : ""}${c.running.length ? `<span><i style="background:${L.night}"></i>GAIA, still running</span>` : ""}${s ? `<div class="ride"><span><b>${s.done}</b>done yesterday${s.you && s.gaia ? `<br>you ${s.you} / GAIA ${s.gaia}` : ""}</span>${s.mail ? `<span><b>${s.mail}</b>emails handled</span>` : ""}${s.focus ? `<span><b>${esc(s.focus)}</b>focus time today</span>` : ""}</div>` : ""}</div>`;
      return `<article class="t-metromap" style="--ground:${skin.ground.ground}; --ink:${skin.ground.ink}; --soft:${skin.ground.soft}; --panel:${skin.ground.panel}; --day:${L.day}; --night:${L.night}; --dec:${L.dec}; --decText:${L.decText}; --face:${skin.face.stack}">
${grain("mt-g", 0.9)}
<div class="hd"><div class="roundel"><span>${esc(ed.weekday.slice(0, 3).toUpperCase())}</span></div><div><div class="auth">GAIA transit authority</div><h1>The ${esc(ed.weekday)} Brief</h1><p class="sub">Line guide No ${ed.editionNo} · ${esc(ed.dateLong)} · ${esc(ed.time)}</p></div></div>
<div class="notice"><b>Service notice</b><p>${esc(ed.deck)}</p></div>
<div class="route" data-fold>${route}</div>
${legend}
</article>`;
    },
  });

  /* ==========================================================================
     THE BOARDING PASS — signature moves from the desktop original:
       a navy airline header (GAIA AIR, briefing class, boarding pass number);
       a route line of rings and dots from first departure to arrival; a
       passenger / flight / date / seat grid in tiny caps labels; itinerary
       rows labelled BOARDING / CONNECTION / CARGO; a stats box row; a
       perforated stub with services completed in transit and a barcode.
     Added detail: crimped perforation with semicircle notches, a punched
     hole, a faint security guilloche, a serrated stub edge, a stacked
     PDF417-style code, a gate cell.
     ======================================================================== */
  function barcode(seed, rows, width) {
    let v = Math.imul(seed, 2654435761) >>> 0;
    const out = [];
    for (let r = 0; r < rows; r++) {
      const stops = [];
      let x = 0;
      while (x < width) {
        v = (Math.imul(v, 1103515245) + 12345) >>> 0;
        const w = 1 + (v % 4);
        const gap = 1 + ((v >> 5) % 3);
        stops.push(`var(--ink) ${x}px ${x + w}px, transparent ${x + w}px ${x + w + gap}px`);
        x += w + gap;
      }
      out.push(`linear-gradient(90deg, ${stops.join(", ")})`);
    }
    return out;
  }
  /* Security guilloche: interleaved sine ribbons, drawn once as an SVG. */
  function guilloche(col) {
    const paths = [];
    for (let k = 0; k < 8; k++) {
      let d = "";
      for (let x = 0; x <= 500; x += 6) {
        const y = 60 + Math.sin(x / 26 + k * 0.8) * 26 + Math.sin(x / 61 + k) * 10;
        d += `${x ? "L" : "M"}${x} ${y.toFixed(1)} `;
      }
      paths.push(`<path d="${d}" fill="none" stroke="${col}" stroke-width=".6"/>`);
    }
    return `<svg class="guil" viewBox="0 0 500 120" preserveAspectRatio="none" aria-hidden="true">${paths.join("")}</svg>`;
  }
  EXPLORER.register({
    id: "boardingpass",
    name: "The Boarding Pass",
    axes: {
      livery: [
        { id: "midnight", label: "midnight + sunflower", liv: "#0a1d4a", acc: "#f0a500", accOn: "#8c5e00" },
        { id: "sky", label: "sky blue", liv: "#0070b8", acc: "#1590d8", accOn: "#00639f" },
        { id: "signal", label: "signal red", liv: "#c8102e", acc: "#d8213c", accOn: "#ad0d27" },
        { id: "graphite", label: "graphite + champagne", liv: "#1d1e22", acc: "#b99a5c", accOn: "#7a6234" },
      ],
      card: [
        { id: "white", label: "white card", paper: "#fbfaf6", desk: "#c9c6bf" },
        { id: "ivory", label: "ivory card", paper: "#f7f1e2", desk: "#b9b2a3" },
      ],
      code: [
        { id: "linear", label: "linear barcode", rows: 1 },
        { id: "stacked", label: "stacked PDF417", rows: 6 },
      ],
    },
    css: `
.t-boardingpass { position: relative; box-sizing: border-box; width: 540px; padding: 34px 26px 44px; background: radial-gradient(120% 80% at 30% 0%, color-mix(in srgb, var(--desk) 80%, #ffffff) 0%, var(--desk) 70%); color: #1b1c22; font: 400 17px/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif; --ink: #1b1c22; }
.t-boardingpass * { box-sizing: border-box; margin: 0; padding: 0; }
.t-boardingpass .pass { position: relative; isolation: isolate; transform: rotate(-.6deg); filter: drop-shadow(0 14px 18px rgba(0,0,0,.28)) drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
.t-boardingpass .body, .t-boardingpass .stub { position: relative; background: var(--paper); overflow: hidden; }
.t-boardingpass .body { border-radius: 14px 14px 0 0; }
.t-boardingpass .grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: multiply; opacity: .1; }
.t-boardingpass .guil { position: absolute; left: 0; right: 0; top: 150px; width: 100%; height: 200px; opacity: .5; pointer-events: none; }
.t-boardingpass .top { position: relative; background: var(--liv); color: #ffffff; padding: 18px 22px; display: flex; justify-content: space-between; align-items: center; }
.t-boardingpass .air { font: 700 24px/1 'Aeonik Extended', 'Helvetica Neue', sans-serif; letter-spacing: .02em; }
.t-boardingpass .top small { display: block; font-size: 14px; font-weight: 700; letter-spacing: 0; margin-top: 6px; opacity: .9; }
.t-boardingpass .top .r { text-align: right; font-size: 14px; font-weight: 700; letter-spacing: 0; }
.t-boardingpass .top .r b { display: block; font-size: 19px; letter-spacing: .04em; margin-top: 4px; }
.t-boardingpass .sec { position: relative; padding: 18px 22px; }
.t-boardingpass .lbl { display: block; font-size: 15px; font-weight: 700; letter-spacing: 0; color: #5b5c63; }
.t-boardingpass .lbl.acc { color: var(--accOn); }
.t-boardingpass .route { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.t-boardingpass .route b { display: block; font-size: 44px; line-height: 1; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.t-boardingpass .route .r { text-align: right; }
.t-boardingpass .path { position: relative; height: 14px; }
.t-boardingpass .path::before { content: ""; position: absolute; left: 7px; right: 7px; top: 6px; border-top: 2px dotted var(--acc); }
.t-boardingpass .path i { position: absolute; top: 0; width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--acc); background: var(--paper); }
.t-boardingpass .deck { font-size: 22px; line-height: 1.3; font-weight: 600; margin-top: 6px; letter-spacing: -.01em; }
.t-boardingpass .grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr .7fr .7fr; gap: 10px; padding-top: 14px; border-top: 1px solid #e3dfd5; }
.t-boardingpass .grid b { display: block; font-size: 16px; font-weight: 700; margin-top: 2px; }
.t-boardingpass .grid b.acc { color: var(--accOn); }
.t-boardingpass .it { display: grid; grid-template-columns: 112px 1fr; padding: 9px 0; border-top: 1px solid #ebe7dd; }
.t-boardingpass .it:first-of-type { border-top: 0; }
.t-boardingpass .it .n { display: block; font-size: 15px; color: #5b5c63; }
.t-boardingpass .it .tm { font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 6px; }
.t-boardingpass .stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid #dcd7cb; border-radius: 6px; margin-top: 4px; }
.t-boardingpass .stats div { padding: 10px 12px; text-align: center; }
.t-boardingpass .stats div + div { border-left: 1.5px solid #dcd7cb; }
.t-boardingpass .stats b { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.t-boardingpass .perf { position: relative; height: 28px; background: var(--paper); }
.t-boardingpass .perf::before { content: ""; position: absolute; left: 20px; right: 20px; top: 13px; border-top: 2px dashed #bdb7a9; }
.t-boardingpass .perf i { position: absolute; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--desk); }
.t-boardingpass .perf i:first-child { left: -14px; } .t-boardingpass .perf i:last-child { right: -14px; }
.t-boardingpass .stub { border-radius: 0 0 6px 6px; padding-bottom: 6px; }
.t-boardingpass .stub::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(135deg, var(--desk) 50%, transparent 50%) 0 0 / 10px 6px repeat-x, linear-gradient(225deg, var(--desk) 50%, transparent 50%) 0 0 / 10px 6px repeat-x; }
.t-boardingpass .hole { position: absolute; right: 26px; top: 20px; width: 18px; height: 18px; border-radius: 50%; background: var(--desk); box-shadow: inset 0 2px 3px rgba(0,0,0,.35); }
.t-boardingpass .sh { display: flex; justify-content: space-between; align-items: baseline; padding-right: 40px; margin-bottom: 8px; }
.t-boardingpass .sh b { font: 700 18px/1 'Aeonik Extended', 'Helvetica Neue', sans-serif; }
.t-boardingpass .svc { display: grid; grid-template-columns: 58px 1fr; padding: 4px 0; font-size: 17px; }
.t-boardingpass .svc > span:first-child { font-weight: 700; font-variant-numeric: tabular-nums; }
.t-boardingpass .svc > span:last-child, .t-boardingpass .it > span:last-child { text-wrap: pretty; }
.t-boardingpass .svc .n { color: #5b5c63; }
.t-boardingpass .code { display: grid; gap: 2px; margin: 16px auto 0; width: 360px; }
.t-boardingpass .code div { height: var(--bh); }
.t-boardingpass .codeno { text-align: center; font: 600 13px/1 Menlo, monospace; letter-spacing: .24em; margin-top: 8px; color: #3c3c42; }
`,
    render(ed, skin) {
      const c = ed.content;
      const needs = c.decisions.slice(0, 3);
      const timed = c.today.filter((e) => e.t24);
      const dep = timed.length ? timed[0].t24 : ed.time24;
      const last = c.today.length ? c.today[c.today.length - 1].t24 || "EOD" : "—";
      const arr = last === dep ? "EOD" : last;
      const conf = needs.length ? `<div class="sec" style="padding-top:4px"><span class="lbl acc">Awaiting your confirmation · ${needs.length}</span>${needs.map((d, i) => `<div class="it" data-role="body"><span class="lbl">Connection ${i + 1}<br><b class="lbl acc">${esc(d.verb)}</b></span><span>${esc(d.label)}${d.note ? `<span class="n">${esc(d.note)}</span>` : ""}</span></div>`).join("")}</div>` : "";
      const role = (i, e) => (!e.t24 ? "Cargo" : i === 0 ? "Boarding" : "Connection");
      const itin = c.today.length ? `<div class="sec" style="padding-top:4px"><span class="lbl">Itinerary · today</span>${c.today.map((e, i) => `<div class="it" data-role="body"><span class="lbl acc">${role(i, e)}</span><span><span class="tm">${e.t24 ? esc(e.t24) : "EOD"}</span>${esc(e.label)}${e.note ? `<span class="n">${esc(e.note)}</span>` : ""}</span></div>`).join("")}</div>` : "";
      const s = c.stats;
      const stats = s ? `<div class="sec" style="padding-top:0"><div class="stats"><div><b>${s.done}</b><span class="lbl">done</span></div>${s.mail ? `<div><b>${s.mail}</b><span class="lbl">emails handled</span></div>` : ""}${s.focus ? `<div><b>${esc(s.focus)}</b><span class="lbl">focus</span></div>` : ""}</div></div>` : "";
      const svcRows = (rows) => rows.map((e) => `<div class="svc" data-role="body"><span>${esc(e.t24)}</span><span>${esc(e.label)}${e.note ? ` <span class="n">— ${esc(e.note)}</span>` : ""}</span></div>`).join("");
      const svc = `${c.overnight.length ? `<span class="lbl">Services completed in transit</span>${svcRows(c.overnight)}` : ""}${c.running.length ? `<span class="lbl">Services still in progress</span>${svcRows(c.running)}` : ""}`;
      const bars = barcode(ed.editionNo, skin.code.rows, 360);
      const bh = skin.code.rows === 1 ? "64px" : "9px";
      const flight = `GA-${String(ed.editionNo).padStart(3, "0")}`;
      return `<article class="t-boardingpass" style="--liv:${skin.livery.liv}; --acc:${skin.livery.acc}; --accOn:${skin.livery.accOn}; --paper:${skin.card.paper}; --desk:${skin.card.desk}; --bh:${bh}">
<div class="pass" data-paper>
  <div class="body">${grain("bp2-g", 0.9)}${guilloche(skin.livery.acc + "33")}
    <div class="top"><div><span class="air">GAIA AIR</span><small>Briefing class</small></div><div class="r">Boarding pass<b>${flight}</b></div></div>
    <div class="sec">
      <div class="route"><div><b>${esc(dep)}</b><span class="lbl">Boarding</span></div><div class="path"><i style="left:0"></i><i style="left:calc(50% - 7px)"></i><i style="right:0"></i></div><div class="r"><b>${esc(arr)}</b><span class="lbl">Arrival</span></div></div>
    </div>
    <div class="sec" style="padding-top:0" data-fold><span class="lbl acc">Captain's note</span><p class="deck">${esc(ed.deck)}</p></div>
    <div class="sec" style="padding-top:0"><div class="grid"><div><span class="lbl">Passenger</span><b>${ed.recipient ? esc(ed.recipient.name) : "You"}</b></div><div><span class="lbl">Flight</span><b>${flight}</b></div><div><span class="lbl">Date</span><b>${pad2(ed.day)} ${esc(ed.monthShort.toUpperCase())}</b></div><div><span class="lbl">Gate</span><b>${esc(ed.weekday.slice(0, 1))}${ed.day}</b></div><div><span class="lbl">Seat</span><b class="acc">${ed.editionNo}A</b></div></div></div>
    ${conf}${itin}${stats}
  </div>
  <div class="perf"><i></i><i></i></div>
  <div class="stub"><div class="sec"><i class="hole" aria-hidden="true"></i>
    <div class="sh"><b>GAIA AIR</b><span class="lbl">${flight} · seat ${ed.editionNo}A · ${pad2(ed.day)} ${esc(ed.monthShort.toUpperCase())}</span></div>
    ${svc}
    <div class="code">${bars.map((g) => `<div style="background:${g}"></div>`).join("")}</div>
    <p class="codeno">GA${ed.editionNo} ${ed.time24.replace(":", "")} RANDERIYA/A</p>
  </div></div>
</div></article>`;
    },
  });
})();

</script>

<script>
// The briefing frame's renderer, loaded by frame.html after the vendored
// templates. Ours, not vendored: copied into public/ by fetch-briefing-editions.mjs.
'use strict';

/** Each list the sidebar edits, and where it lives on ed; the weekly reads ed.week, not the day. */
const DAILY_SECTIONS = {
  decisions: (ed) => ed.content.decisions,
  today: (ed) => ed.content.today,
  overnight: (ed) => ed.content.overnight,
  running: (ed) => ed.content.running,
};
const WEEKLY_SECTIONS = {
  decisions: (ed) => ed.content.decisions,
  ahead: (ed) => ed.week.ahead,
  shipped: (ed) => ed.week.shipped,
  handled: (ed) => ed.week.handled,
};

/**
 * Where each edition writes its section headings. A section's heading is the
 * nearest match before its first item with no other section's item in between,
 * so a section without one (The Menu's courses) is left alone. `whole`: the
 * heading is one phrase with its count inside ("Two things need your call");
 * otherwise only the heading's own words change and its numerals stay.
 */
const HEADINGS = {
  band: { selector: "section > h2", whole: true },
  playfair: { selector: "h2 > span" },
  broadsheet: { selector: "h3.sech" },
  gradient: { selector: "h2" },
  exhibition: { selector: "h3" },
  weekly: { selector: "h2" },
  librarycard: { selector: ".sl" },
  menu: { selector: "h2" },
  invoice: { selector: "h2" },
  postal: { selector: "h3.blabel" },
  swiss: { selector: "h2" },
  memo: { selector: "section > h3" },
  almanac: { selector: "h2.sc" },
  receipt: { selector: "p.sec" },
  flightplan: { selector: "h2.lbl > span:first-child" },
  instrument: { selector: ".head > .lbl:first-child" },
  metromap: { selector: ".chip", whole: true },
  boardingpass: { selector: ".lbl:not(.it *)", whole: true },
};

const root = document.getElementById("root");

function textNodes(within) {
  const walker = document.createTreeWalker(within, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) =>
      n.data.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  return nodes;
}

const labelOf = (item) => (typeof item === "string" ? item : item.label);

/** The heading's own words: its first text node with letters, else (or when whole) all of it. */
function wordsNode(el, whole) {
  if (whole) return null;
  return textNodes(el).find((n) => /\p{L}{2}/u.test(n.data)) ?? null;
}

function findHeadings(family, ed) {
  const spec = HEADINGS[family];
  if (!spec)
    throw new Error(`no heading selector for edition family: ${family}`);
  const nodes = textNodes(root);
  const position = new Map(nodes.map((n, i) => [n, i]));
  const itemsAt = {};
  for (const [section, list] of Object.entries(
    ed.week ? WEEKLY_SECTIONS : DAILY_SECTIONS,
  )) {
    // Some editions set their rows in capitals (The Receipt).
    const labels = list(ed)
      .map(labelOf)
      .filter(Boolean)
      .map((l) => l.toLowerCase());
    itemsAt[section] = nodes.flatMap((n, i) =>
      labels.some((l) => n.data.toLowerCase().includes(l)) ? [i] : [],
    );
  }
  const candidates = [...root.querySelectorAll(spec.selector)]
    .map((el) => ({ el, at: position.get(textNodes(el)[0]) }))
    .filter((c) => c.at !== undefined);

  const found = {};
  for (const [section, at] of Object.entries(itemsAt)) {
    if (!at.length) continue;
    const first = at[0];
    const others = Object.entries(itemsAt).flatMap(([s, ats]) =>
      s === section ? [] : ats,
    );
    const heading = candidates
      .filter((c) => c.at < first && !others.some((o) => o > c.at && o < first))
      .pop();
    if (heading) found[section] = heading.el;
  }
  return { found, whole: Boolean(spec.whole) };
}

window.briefing = {
  templates: TEMPLATES.map(({ id, name, axes }) => ({ id, name, axes })),
  /** Render one edition, renaming section headings by `overrides`; returns its height and own headings. */
  render(family, skin, pageEd, overrides = {}) {
    const tpl = TEMPLATES.find((t) => t.id === family);
    if (!tpl) throw new Error(`edition family not registered: ${family}`);
    // This frame has an opaque origin, so it uses the images it carries (frame.html).
    const ed = {
      ...pageEd,
      assets: { ...FRAME_ASSETS, ...pageEd.assets },
      art: { ...pageEd.art, src: INLINE_ART[pageEd.art.src] ?? pageEd.art.src },
    };
    document.getElementById("tpl-css").textContent = tpl.css;
    root.innerHTML = tpl.render(ed, skin);

    const { found, whole } = findHeadings(family, ed);
    const headings = {};
    for (const [section, el] of Object.entries(found)) {
      const words = wordsNode(el, whole);
      headings[section] = (words ? words.data : el.textContent)
        .replace(/\s+/g, " ")
        .trim();
      const override = overrides[section];
      if (!override) continue;
      if (words) words.data = override;
      else el.textContent = override;
    }
    return { height: root.scrollHeight, headings };
  },
};

// The page talks to this sandboxed (opaque-origin) frame by message only:
// hello -> ready {templates}; render -> rendered {height, headings}; resizes -> height.
const post = (message) => parent.postMessage(message, "*");
addEventListener("message", (event) => {
  if (event.source !== parent) return;
  const message = event.data;
  if (message?.type === "hello") {
    post({ type: "ready", templates: window.briefing.templates });
  } else if (message?.type === "render") {
    const { family, skin, ed, overrides } = message;
    post({ type: "rendered", ...window.briefing.render(family, skin, ed, overrides) });
  }
});
new ResizeObserver(() => post({ type: "height", height: root.scrollHeight })).observe(root);

</script>
</body>
</html>
