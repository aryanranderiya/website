pre-commit:
  parallel: true
  commands:
    react-doctor:
      run: react_doctor_output=$(mktemp "${TMPDIR:-/tmp}/react-doctor-hook.XXXXXX"); if bunx react-doctor --staged --blocking warning > "$react_doctor_output" 2>&1; then rm -f "$react_doctor_output"; else cat "$react_doctor_output" >&2; rm -f "$react_doctor_output"; printf "%s\n" "React Doctor found staged regressions." "Run react-doctor --staged --blocking warning to inspect." "Want them fixed? Ask your agent to run that command and resolve the findings." >&2; fi
    astro-doctor:
      run: astro_doctor_output=$(mktemp "${TMPDIR:-/tmp}/astro-doctor-hook.XXXXXX"); if bunx astro-doctor --staged --blocking error > "$astro_doctor_output" 2>&1; then rm -f "$astro_doctor_output"; else cat "$astro_doctor_output" >&2; rm -f "$astro_doctor_output"; printf "%s\n" "Astro Doctor found staged regressions." "Run astro-doctor --staged --blocking error to inspect." "Want them fixed? Ask your agent to run that command and resolve the findings." >&2; fi
    biome:
      # Match biome.json's `files.includes` (src/**/*.{ts,tsx,astro}) so we don't
      # hand biome paths it ignores (package.json, etc.) — biome exits non-zero
      # when every staged file is on its ignore list.
      glob: "src/**/*.{ts,tsx,astro}"
      # Safe fixes only — --unsafe would destructively delete style props (noInlineStyles)
      run: bunx biome check --write {staged_files}
      stage_fixed: true
    type-check:
      run: bunx astro check

pre-push:
  parallel: true
  commands:
    biome:
      run: bunx biome check ./src
    dead-code:
      run: bunx knip --max-issues 0
    type-check:
      run: bunx astro check
