# CircleCI config — replaces .github/workflows/tech-debt.yml because the
# GitHub-side Actions account is currently restricted (unpaid dues). CircleCI
# runs on its own infrastructure (separate from GitHub Actions) and listens
# to GitHub via webhook + OAuth, so it works regardless of GH Actions status.
#
# Free tier: 6,000 build minutes/month, no credit card required.
# Personal accounts supported.
#
# One-time setup:
#   1. Sign up at https://circleci.com with your GitHub account (OAuth, no card).
#   2. Dashboard → Projects → set up project for `aryanranderiya/website`.
#   3. Choose "fastest" → CircleCI detects this file and starts the first build.
#
# Each job runs in parallel via the workflow at the bottom of this file.
# The `required` job depends on every other job and is the natural target
# for branch protection.

version: 2.1

# ─── Shared executor ─────────────────────────────────────────────────────────
# cimg/node is the official CircleCI Node image. Ubuntu-based, has sudo, lets
# us apt-get ffmpeg in the media-validation job.

executors:
  node:
    docker:
      - image: cimg/node:22.12
    resource_class: medium  # 2 vCPU / 4 GB — well within the free tier

# ─── Reusable command: install bun + project deps with cache ────────────────

commands:
  install_deps:
    description: Install bun and project deps with caching
    steps:
      - checkout
      - run:
          name: Install bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - bun-v1-{{ checksum "bun.lock" }}
            - bun-v1-
      - run:
          name: bun install
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
            - node_modules

# ─── Jobs ────────────────────────────────────────────────────────────────────

jobs:

  # Code-quality lane

  lint:
    executor: node
    steps:
      - install_deps
      - run: bun run check
      - run: bun run lint:emdash

  type-check:
    executor: node
    steps:
      - install_deps
      - run: bun run type-check

  build:
    executor: node
    steps:
      - install_deps
      - run: bun run build

  dead-code:
    executor: node
    steps:
      - install_deps
      - run:
          name: knip (report only — non-blocking until baselined)
          command: bun run dead-code --reporter compact || true

  # Asset lane

  unused-assets:
    executor: node
    steps:
      - install_deps
      - run: bun run unused-assets

  media-validation:
    executor: node
    steps:
      - install_deps
      - run:
          name: Install ffmpeg
          command: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun run validate-media

  image-budget:
    executor: node
    steps:
      - checkout
      # No deps needed — the script is pure Node stdlib.
      - run: node scripts/image-budget.mjs

  # Security lane

  # High-severity gate with a documented baseline. Each --ignore below is
  # either a devDependency-only chain (never shipped to the Worker) with no
  # published fix, or a fix that requires an incompatible major.
  # Production-reaching CVEs (astro, maplibre, sharp, boneyard) are fixed via
  # direct bumps + package.json `overrides`, NOT here. Re-run plain
  # `bun audit` periodically: any NEW advisory fails.
  # - GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3: extract-zip symlink
  #   traversal, latest release still vulnerable. Chain: lighthouse >
  #   puppeteer (local-only browser installer).
  # - GHSA-r5fr-rjxr-66jc: lodash _.template injection, no fixed release.
  #   Chain: @lhci/cli > inquirer (local-only CLI).
  # - GHSA-rpmf-866q-6p89, GHSA-rp42-5vxx-qpwr: basic-ftp DoS, fix requires
  #   5.x -> 6.x major. Chain: lighthouse/puppeteer FTP proxy helpers.
  security-audit:
    executor: node
    steps:
      - install_deps
      - run:
          name: bun audit (high severity + baseline)
          command: >
            bun audit --audit-level=high
            --ignore GHSA-jmr9-qjv8-65gv --ignore GHSA-7pqw-9j4j-h8q3
            --ignore GHSA-r5fr-rjxr-66jc
            --ignore GHSA-rpmf-866q-6p89 --ignore GHSA-rp42-5vxx-qpwr

  secret-scan:
    executor: node
    steps:
      - checkout
      - run:
          name: Install gitleaks
          command: |
            curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz | tar -xz
            sudo mv gitleaks /usr/local/bin/
      - run:
          name: Scan for committed secrets
          # .gitleaks.toml allowlists reviewed false positives; the baseline
          # pins the two historical ones so only NEW findings fail the job.
          command: gitleaks detect --source . --verbose --redact --baseline-path .gitleaksbaseline

  # Aggregate gate — depend on everything; this is the job to mark "Required"
  # in CircleCI's branch protection.

  required:
    executor: node
    steps:
      - run: echo "All required checks passed."

# ─── Workflow ────────────────────────────────────────────────────────────────

workflows:
  tech-debt:
    jobs:
      - lint
      - type-check
      - build
      - dead-code
      - unused-assets
      - media-validation
      - image-budget
      - security-audit
      - secret-scan
      - required:
          requires:
            - lint
            - type-check
            - build
            - unused-assets
            - media-validation
            - image-budget
            - security-audit
            - secret-scan
